# Hotfix — bloqueia acesso externo ao endpoint de métricas do Tomcat
# Aplicar no frontend/backend relevante do HAProxy

acl is_metrics path_beg -i /metrics
http-request deny if is_metrics

# Reforço adicional (ver vulnerabilidades/headers-seguranca-ausentes/writeup.md):
http-response set-header X-Frame-Options DENY
http-response set-header X-Content-Type-Options nosniff
